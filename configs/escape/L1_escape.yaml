# algo config
space_format: ray

# simulation config
sim_freq: 75
sim_steps: 10 # step 0.1s
map_size: 50 #km
rnd_init: true # random initial state

# termination config
horizon: 600 # episode length: 100s
altitude_limit: 2500 #m
altitude_limit_max: 10000 ## m
acceleration_limit_x: 9.0
acceleration_limit_y: 9.0
acceleration_limit_z: 9.0

# aircraft config
num_agents: 2
aircraft: {
  B1: {
    model: f16,
    mission: task_escape,
    num_missiles: 10, #used for cannon shots
    init_state: {
      ic_long_gc_deg: 0.0,
      ic_lat_geod_deg: -0.1,
      ic_h_sl_ft: 19000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 800.0,
    },
  },
  R2: {
    model: f16,
    mission: model_L3Maneuver,
    num_missiles: 10,
    init_state: {
      ic_long_gc_deg: 0,
      ic_lat_geod_deg: 0.065,
      ic_h_sl_ft: 19000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 600.0,
    },
  }
}
# (lontitude, latitude, altitude)
battle_field_center: [0.0, 0.0, 0.0]

# reward config

ShootPenaltyReward_scale: 1
ShootPenaltyReward_posture_punish: false

DistanceReward_potential: true
DistanceReward_scale: 1

HeadingReward_with_opp: false
HeadingReward_roll_only: true
HeadingReward_scale: 0.05

FleeReward_potential: false
FleeReward_scale: 0.1

## -- TERMINATIONS -- ##:
# ExtremeState (incl out-of-boundary), Overload (accel.), 
# LowAltitude (height min & max), Timeout (env.steps), 
# DeadAgent (all opps destroyed)

