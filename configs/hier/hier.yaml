# algo config
space_format: ray

# simulation config
sim_freq: 100
sim_steps: 10       # step 0.1s
hl_sim_steps: 12    # * low-level sim_steps
map_size: 80 #km
rnd_init: true

# termination config
horizon: 100 # 100 train, 2000 eval
altitude_limit: 2500 #m
altitude_limit_max: 10000 ## m
acceleration_limit_x: 9.0
acceleration_limit_y: 9.0
acceleration_limit_z: 9.0

# aircraft config
