# algo config
space_format: ray

# simulation config
sim_freq: 100
sim_steps: 10 # step 0.1s
map_size: 50 #km
rnd_init: true

# termination config
horizon: 1000 # episode length: 100s
altitude_limit: 2500 #m
altitude_limit_max: 10000 ## m
acceleration_limit_x: 9.0
acceleration_limit_y: 9.0
acceleration_limit_z: 9.0

# aircraft config
num_agents: 2
aircraft: {
  B1: {
    model: f16,
    mission: task_cannon,
    num_missiles: 8, #used for cannon shots
    init_state: {
      ic_long_gc_deg: 0.0,
      ic_lat_geod_deg: -0.1,
      ic_h_sl_ft: 19000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 800.0,
    },
  },
  R2: {
    model: f16, #only use f16 in L4
    mission: model_strategy,
    num_missiles: 10,
    init_state: {
      ic_long_gc_deg: 0,
      ic_lat_geod_deg: 0.1,
      ic_h_sl_ft: 19000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 600.0,
    },
  }
}
# (lontitude, latitude, altitude)
battle_field_center: [0.0, 0.0, 0.0]

# reward config

HeadingReward_with_opp: false
HeadingReward_scale: 0.05

ShootReward_scale: 1
ShootReward_orientation_kill: true

ShootPenaltyReward_posture_punish: false
ShootPenaltyReward_scale: 0.75

RollPitch_scale: 1

## -- TERMINATIONS -- ##:
# ExtremeState (incl out-of-boundary), Overload (accel.), 
# LowAltitude (height min & max), Timeout (env.steps), 
# DeadAgent (all opps destroyed)

